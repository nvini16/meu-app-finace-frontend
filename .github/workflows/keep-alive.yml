name: Supabase Keep-Alive

on:
  schedule:
    # Roda a cada 3 dias às 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite rodar manualmente pelo GitHub para testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project
        run: |
          curl -I -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"